# mailscan configuration (shipped defaults).
# Copy to ~/.config/mailscan/config.toml to override per-machine, or point
# $MAILSCAN_CONFIG at your own file.

# --- scanner / SANE ---
device      = "epsonds"
source      = "ADF Front"
mode        = "Color"        # Color | Gray | Lineart
resolution  = 300            # 200 | 300 | 400 | 600
usb_id      = "04b8:016c"    # Epson ES-50

# --- batching (the timeout delimiter, v1) ---
# Finalize the current mail item after this many seconds with no new sheet.
email_timeout        = 8.0
# After this much total silence, stop polling so the scanner can sleep.
# (Kept generous so gathering the next mail item doesn't cut the session off.)
session_idle_timeout = 180.0
# How often to check the feeder while a session is active.
poll_interval        = 2.0
# After a session ends we wait (without touching USB) for the scanner to drop
# off the bus so it can sleep. If it stays enumerated but idle this long, stop
# waiting and re-arm a scan session anyway — otherwise a scanner that won't
# disconnect leaves the daemon deaf to fed sheets.
sleep_wait_timeout   = 120.0

# --- wake behaviour ---
# true  = stay silent while the scanner sleeps; wake on button press (udev).
# false = poll whenever the scanner is present on the USB bus.
require_wake = true

# --- output ---
output_dir      = "~/scans"
filename_prefix = "mail"

# --- upload (rclone → Google Drive), run by mailscan-upload.timer ---
# rclone "remote:path" finished PDFs are moved to (must match rclone.conf).
drive_remote   = "MailScans:MailScans"
# Skip PDFs younger than this (seconds) — they may still be mid-write.
upload_min_age = 60.0

# --- Telegram notification (sent once a PDF is on Drive) ---
# Prefer the TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID env vars (see .env.example)
# — they override these and keep the token out of this checked-in file.
# Leave blank to disable notifications.
telegram_bot_token = ""
telegram_chat_id   = ""
