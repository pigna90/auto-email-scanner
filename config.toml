# mailscan configuration (shipped defaults).
# Copy to ~/.config/mailscan/config.toml to override per-machine, or point
# $MAILSCAN_CONFIG at your own file.

# --- scanner / SANE ---
device      = "epsonds"
source      = "ADF Front"
mode        = "Color"        # Color | Gray | Lineart
resolution  = 300            # 200 | 300 | 400 | 600
usb_id      = "04b8:016c"    # Epson ES-50

# --- batching (the timeout delimiter, v1) ---
# Finalize the current mail item after this many seconds with no new sheet.
email_timeout        = 8.0
# After this much total silence, stop polling so the scanner can sleep.
# (Kept generous so gathering the next mail item doesn't cut the session off.)
session_idle_timeout = 180.0
# How often to check the feeder while a session is active.
poll_interval        = 2.0
# After a session ends we wait (without touching USB) for the scanner to drop
# off the bus so it can sleep. If it stays enumerated but idle this long, stop
# waiting and re-arm a scan session anyway — otherwise a scanner that won't
# disconnect leaves the daemon deaf to fed sheets.
sleep_wait_timeout   = 120.0

# --- wake behaviour ---
# true  = stay silent while the scanner sleeps; wake on button press (udev).
# false = poll whenever the scanner is present on the USB bus.
require_wake = true

# --- output ---
output_dir      = "~/scans"
filename_prefix = "mail"

# --- upload (rclone → Google Drive), run by mailscan-upload.timer ---
# rclone "remote:path" finished PDFs are moved to (must match rclone.conf).
drive_remote   = "MailScans:MailScans"
# Skip PDFs younger than this (seconds) — they may still be mid-write.
upload_min_age = 60.0

# --- Telegram notification (sent once a PDF is on Drive) ---
# Prefer the TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID env vars (see .env.example)
# — they override these and keep the token out of this checked-in file.
# Leave blank to disable notifications.
telegram_bot_token = ""
telegram_chat_id   = ""

# --- LLM classification + summary (one Claude call in the upload path) ---
# Prefer the ANTHROPIC_API_KEY env var (see .env.example) — it overrides this and
# keeps the key out of this checked-in file. Blank = no LLM: files keep their
# timestamp name, go to the default category, and the message carries no summary.
anthropic_api_key = ""
# Language the summary is written in (any language name the model understands,
# e.g. "Italian", "English", "German"). Shown inline in the Telegram message
# inside an expandable blockquote. Only affects the LLM output.
summary_language  = "Italian"

# --- automatic classification (one Claude call → title + category + summary),
#     run in the upload path. Best-effort: on failure the file keeps its
#     mail_<ts>.pdf name and goes to `default_category`. See namer.py. ---
# Claude vision model that reads the whole PDF (reuses the ANTHROPIC_API_KEY /
# anthropic_api_key above). Blank key = classification off (files keep their
# timestamp name and the default folder).
naming_claude_model  = "claude-haiku-4-5"
# File name (title) language — the model translates into it from the (often
# German) document. English keeps every file name uniform.
naming_language      = "English"
# Where a document goes if a valid category can't be obtained, and how many
# extra times to re-ask the model when it returns an unknown category.
default_category     = "other"
classify_max_retries = 3

# Categories the model must choose from. Each key is the Drive subfolder name;
# each value is the description shown to the model to guide the choice. "other"
# is the fallback. Edit / add / remove freely — keep the set tight.
[categories]
medical    = "Health and medical matters: doctors, hospitals, prescriptions, lab results and medical reports, therapy, vaccinations — anything health-related."
insurance  = "Insurance policies, contributions and claims of any kind: health insurance (Krankenkasse/AOK), liability (Haftpflicht), car (KFZ), home/contents (Hausrat), life, legal protection."
finance    = "Banking and money: bank and account statements, the tax office and tax returns, invoices and bills to be paid, payment and transfer confirmations, salary and payslips, loans, investments."
household  = "Home and utilities: electricity, gas, water, heating, internet, telephone/mobile, rent and landlord correspondence, home services and repairs."
government = "Official and state communications: city hall/Bürgeramt, tax authority, police, courts, residence and registration, pensions, the public broadcasting fee (Rundfunkbeitrag/ARD/ZDF)."
other      = "Anything that does not clearly belong to one of the categories above."
