[project]
name = "mailscan"
version = "0.1.0"
description = "Headless batch scanner for the Epson ES-50: auto-scan fed sheets and group them into one PDF per mail item."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyudev>=0.24",
    "img2pdf>=0.6.3",
    "pillow>=12.3.0",
    "python-sane>=2.9.2",
]

[project.scripts]
mailscan = "mailscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailscan"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
